<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Portal</title>
<link rel="stylesheet" href="/static/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="viewer">
<header>
  <span id="status" class="status">connecting…</span>
  <span id="mode" class="mode"></span>
  <nav id="keys" aria-label="Quick answers">
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="up" aria-label="Up">↑</button>
    <button data-key="down" aria-label="Down">↓</button>
    <button data-key="enter">Enter</button>
    <button data-key="esc">Esc</button>
  </nav>
  <span class="spacer"></span>
  <button id="smaller" title="Smaller text">A−</button>
  <button id="bigger" title="Larger text">A+</button>
  <button id="redraw" title="Ask the program to repaint">Redraw</button>
  <form method="post" action="/logout"><button type="submit">Sign out</button></form>
</header>
<div id="wrap"><div id="term"></div></div>
<script src="/static/xterm.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
