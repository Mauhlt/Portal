<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<title>Portal</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="viewer">
<header>
  <span id="status" class="status">connecting…</span>
  <span id="mode" class="mode"></span>
  <span class="spacer"></span>
  <button type="button" data-cmd="1" title="Fit terminal to window">Fit</button>
  <button type="button" data-cmd="2" title="Smaller text">A−</button>
  <button type="button" data-cmd="3" title="Larger text">A+</button>
  <form method="post" action="/logout"><button type="submit" title="Forget this device">Unpair</button></form>
</header>
<!-- The terminal and the answer bar are drawn by the wasm client (src/wasm). -->
<main id="wrap"><canvas id="screen" aria-label="Terminal"></canvas></main>
<script src="/static/app.js"></script>
</body>
</html>
