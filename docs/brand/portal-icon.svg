<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 600 600">
  <!-- Portal app icon, master (full detail). The rasters in this folder are
       drawn from the same geometry by src/tools/icon_art.zig (`zig build
       brand`), which also simplifies it below ~64 px. The square background
       is the iOS variant; Windows icons leave the outside transparent. -->
  <defs>
    <radialGradient id="bg" cx="300" cy="300" r="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1A4A"/>
      <stop offset="1" stop-color="#02040F"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="38" x2="0" y2="562" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1028D8"/>
      <stop offset="0.3" stop-color="#0066FF"/>
      <stop offset="0.55" stop-color="#00C8FF"/>
      <stop offset="0.78" stop-color="#00FFC2"/>
      <stop offset="1" stop-color="#7DFF5C"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="60" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02040F"/>
      <stop offset="0.55" stop-color="#071640"/>
      <stop offset="1" stop-color="#123274"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="300" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E90FF"/>
      <stop offset="0.55" stop-color="#4FB8FF"/>
      <stop offset="1" stop-color="#BDEBFF"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="330" x2="0" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CC2EE"/>
      <stop offset="1" stop-color="#4A6CB0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="430" x2="0" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A3E635"/>
      <stop offset="0.35" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="300" cy="300" r="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AAEFF" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="#5AAEFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5AAEFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="300" cy="300" r="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC23A" stop-opacity="0.76"/>
      <stop offset="0.35" stop-color="#FFC23A" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#FFC23A" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFC23A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="300" cy="300" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FAFF"/>
      <stop offset="0.45" stop-color="#C4E3FF"/>
      <stop offset="0.8" stop-color="#7DB9FF"/>
      <stop offset="1" stop-color="#3A7DEB"/>
    </radialGradient>
    <radialGradient id="sun" cx="300" cy="300" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D0"/>
      <stop offset="0.4" stop-color="#FFE27A"/>
      <stop offset="0.75" stop-color="#FFA733"/>
      <stop offset="1" stop-color="#E5341B"/>
    </radialGradient>
    <linearGradient id="glint" x1="198" y1="0" x2="402" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="star" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="disc"><circle cx="300" cy="300" r="233"/></clipPath>
    <clipPath id="top"><rect x="0" y="0" width="600" height="300"/></clipPath>
    <clipPath id="bottom"><rect x="0" y="300" width="600" height="300"/></clipPath>
    <clipPath id="snow"><rect x="0" y="0" width="600" height="334"/></clipPath>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="247" fill="none" stroke="url(#ring)" stroke-width="40" opacity="0.55" filter="url(#neon)"/>

  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="600" height="300" fill="url(#night)"/>
    <rect x="0" y="300" width="600" height="300" fill="url(#sky)"/>
    <circle cx="300" cy="300" r="174" fill="url(#moonGlow)" clip-path="url(#top)"/>
    <circle cx="300" cy="300" r="174" fill="url(#sunGlow)" clip-path="url(#bottom)"/>

    <g id="peaks">
      <path d="M60 446 L60 362 L100 328 L122 342 L158 304 L204 356 L244 404 L274 446 Z" fill="url(#rock)"/>
      <path d="M540 446 L540 362 L500 328 L478 342 L442 304 L396 356 L356 404 L326 446 Z" fill="url(#rock)"/>
      <g clip-path="url(#snow)" fill="#EAF4FF">
        <path d="M60 446 L60 362 L100 328 L122 342 L158 304 L204 356 L244 404 L274 446 Z"/>
        <path d="M540 446 L540 362 L500 328 L478 342 L442 304 L396 356 L356 404 L326 446 Z"/>
      </g>
    </g>

    <path d="M60 440 C 120 434, 180 434, 240 440 S 360 446, 420 440 S 500 434, 540 440 L540 560 L60 560 Z" fill="url(#grass)"/>

    <g fill="none" stroke-width="4.7" opacity="0.55" filter="url(#soft)">
      <g clip-path="url(#top)">
        <circle cx="300" cy="300" r="108" stroke="#C4B5FD"/>
        <circle cx="300" cy="300" r="103.3" stroke="#A5B4FC"/>
        <circle cx="300" cy="300" r="98.7" stroke="#818CF8"/>
        <circle cx="300" cy="300" r="94" stroke="#60A5FA"/>
        <circle cx="300" cy="300" r="89.3" stroke="#22D3EE"/>
        <circle cx="300" cy="300" r="84.7" stroke="#2DD4BF"/>
        <circle cx="300" cy="300" r="80" stroke="#CFFAFE"/>
      </g>
      <g clip-path="url(#bottom)">
        <circle cx="300" cy="300" r="108" stroke="#FF3B30"/>
        <circle cx="300" cy="300" r="103.3" stroke="#FF9500"/>
        <circle cx="300" cy="300" r="98.7" stroke="#FFD60A"/>
        <circle cx="300" cy="300" r="94" stroke="#34C759"/>
        <circle cx="300" cy="300" r="89.3" stroke="#0A84FF"/>
        <circle cx="300" cy="300" r="84.7" stroke="#5856D6"/>
        <circle cx="300" cy="300" r="80" stroke="#AF52DE"/>
      </g>
    </g>

    <g transform="translate(300 156) scale(0.8) translate(-303 -188)">
      <g fill="none" stroke="#B8E0FF" stroke-opacity="0.75" stroke-width="2.75" stroke-linejoin="round">
        <path d="M196 214 L182 188 L184 160 L198 134 L222 114 L252 102 L286 98 L318 100 L348 108 L376 122 L398 142 L410 166 L412 190 L404 208 L418 222 L414 240 L394 248 L370 244 L352 232 L330 216 L300 218 L270 214 L244 220 L220 222 Z"/>
        <path d="M318 100 L306 132 L312 160 L300 188 L304 216"/>
        <path d="M210 196 L240 186 L272 180 L300 188 L330 186 L354 196"/>
        <path d="M252 102 L262 136 L250 160 L272 180"/>
        <path d="M348 108 L344 140 L366 162 L398 170"/>
      </g>
      <g fill="#D6EEFF" opacity="0.6" filter="url(#star)">
        <circle cx="198" cy="134" r="7"/><circle cx="252" cy="102" r="7"/><circle cx="318" cy="100" r="7"/><circle cx="376" cy="122" r="7"/>
        <circle cx="410" cy="178" r="7"/><circle cx="300" cy="188" r="7"/><circle cx="184" cy="174" r="7"/><circle cx="414" cy="240" r="7"/>
        <circle cx="300" cy="218" r="7"/><circle cx="244" cy="220" r="7"/><circle cx="352" cy="232" r="7"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="198" cy="134" r="4.5"/><circle cx="252" cy="102" r="4.5"/><circle cx="318" cy="100" r="4.5"/><circle cx="376" cy="122" r="4.5"/>
        <circle cx="410" cy="178" r="4.5"/><circle cx="300" cy="188" r="4.5"/><circle cx="184" cy="174" r="4.5"/><circle cx="414" cy="240" r="4.5"/>
        <circle cx="300" cy="218" r="4.5"/><circle cx="244" cy="220" r="4.5"/><circle cx="352" cy="232" r="4.5"/>
      </g>
    </g>

    <circle cx="300" cy="300" r="60" fill="url(#moon)" clip-path="url(#top)"/>
    <circle cx="300" cy="300" r="60" fill="url(#sun)" clip-path="url(#bottom)"/>
    <circle cx="300" cy="300" r="58.5" fill="none" stroke="#D6EEFF" stroke-width="3" opacity="0.9" clip-path="url(#top)"/>
    <circle cx="300" cy="300" r="58.5" fill="none" stroke="#FFE7A3" stroke-width="3" opacity="0.9" clip-path="url(#bottom)"/>
    <path d="M198 300 L300 297.5 L402 300 L300 302.5 Z" fill="url(#glint)"/>
  </g>

  <circle cx="300" cy="300" r="247" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="300" cy="300" r="247" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="9.6"/>
  <circle cx="300" cy="300" r="278" fill="none" stroke="url(#ring)" stroke-opacity="0.5" stroke-width="2.4"/>
  <circle cx="300" cy="300" r="220" fill="none" stroke="url(#ring)" stroke-opacity="0.8" stroke-width="2.4"/>
</svg>
